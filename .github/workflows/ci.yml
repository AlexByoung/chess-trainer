name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser for Playwright (preinstalled Google Chrome)
        run: google-chrome --version
      - name: Smoke tests (Playwright, local build)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - name: Package site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Verifies the live site: waits until the new build is served, then runs the
  # same Playwright smoke tests (puzzle solve, Stockfish reply, reload) against it.
  live-check:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for this commit to be live
        run: |
          want="${GITHUB_SHA::7}"
          for i in $(seq 1 60); do
            got=$(curl -fsSL "${BASE_URL}version.json?t=$(date +%s)" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)
            echo "live: ${got:-none} want: $want"
            [ "$got" = "$want" ] && exit 0
            sleep 10
          done
          exit 1
      - name: Engine files are served
        run: |
          curl -fsSI "${BASE_URL}engine/stockfish-18-lite-single.wasm" | tee /dev/stderr | grep -qi '200'
          curl -fsSI "${BASE_URL}puzzles.json.gz" | grep -qi '200'
      - name: Browser for Playwright (preinstalled Google Chrome)
        run: google-chrome --version
      - name: Smoke tests against the live URL
        run: npx playwright test
